<div class="app-container">
  <header class="app-header">
    <div class="header-container">
      <div class="app-logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="3" width="18" height="18" rx="2" stroke="white" stroke-width="2"/>
            <path d="M9 3V21" stroke="white" stroke-width="2"/>
            <path d="M15 3V21" stroke="white" stroke-width="2"/>
          </svg>
        </div>
        <span class="logo-text">Kanban<span>Pro</span></span>
      </div>

      <div class="header-actions">
        <button class="btn-create" (click)="onCreateTaskClick()">
          <span class="icon">+</span>
          <span class="text">New Task</span>
        </button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div *ngIf="loading" class="loading-state">
      <div class="spinner"></div>
      <p>Organizing your workflow...</p>
    </div>

    <div *ngIf="!loading" class="dashboard-content">
      <section class="stats-overview">
        <div class="stat-card total">
          <div class="stat-info">
            <span class="stat-label">Total Tasks</span>
            <span class="stat-value">{{ tasks.length }}</span>
          </div>
          <div class="stat-progress" [style.width.%]="100"></div>
        </div>

        <div class="stat-card in-progress">
          <div class="stat-info">
            <span class="stat-label">In Progress</span>
            <span class="stat-value">{{ getTasksCount('in_progress') }}</span>
          </div>
          <div class="stat-progress" [style.width.%]="tasks.length > 0 ? (getTasksCount('in_progress') / tasks.length) * 100 : 0"></div>
        </div>

        <div class="stat-card completed">
          <div class="stat-info">
            <span class="stat-label">Completed</span>
            <span class="stat-value">{{ getTasksCount('done') }}</span>
          </div>
          <div class="stat-progress" [style.width.%]="tasks.length > 0 ? (getTasksCount('done') / tasks.length) * 100 : 0"></div>
        </div>
      </section>

      <div class="board-title-area">
        <div class="title-group">
          <h1>Workflow Board</h1>
          <p class="subtitle">Manage your tasks and boost productivity</p>
        </div>
      </div>

      <div class="kanban-wrapper">
        <app-kanban-board
          [tasks]="tasks"
          [columns]="columns"
          (taskDeleted)="deleteTask($event)"
          (taskMoved)="moveTask($event)"
        >
        </app-kanban-board>
      </div>
    </div>
  </main>


  <footer class="app-footer">
    <div class="footer-content">
      <p>&copy; 2026 KanbanPro. Designed for efficiency.</p>
    </div>
  </footer>


  <ng-container *ngIf="modalState$ | async as state">
    <app-task-modal
      *ngIf="state.isOpen"
      [task]="state.task"
      [mode]="state.mode"
      (close)="closeModal()"
      (submit)="onTaskSubmit($event)"
    ></app-task-modal>
  </ng-container>
</div>
