<div class="modal-overlay" (click)="onCancel()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <!-- Modal Header -->
    <div class="modal-header">
      <h2>{{ mode === "create" ? "Create New Task" : "Edit Task" }}</h2>
      <button class="close-btn" (click)="onCancel()">✕</button>
    </div>

    <!-- Modal Body -->
    <div class="modal-body">
      <form [formGroup]="taskForm">
        <div class="form-group">
          <label for="name-input">Title *</label>
          <input
            type="text"
            placeholder="Enter task title"
            class="form-input"
            formControlName="title"
          />
          <div *ngIf="title?.touched && title?.invalid" class="error-message">
            <span *ngIf="title?.errors?.['required']">Title is required</span>
            <span *ngIf="title?.errors?.['minlength']"
              >Title must be at least 3 characters</span
            >
          </div>
        </div>

        <div class="form-group">
          <label for="desc-input">Description</label>

          <textarea
            formControlName="description"
            placeholder="Enter task description (max 3000 characters)"
            class="form-textarea"
          ></textarea>

          <div
            *ngIf="description?.touched && description?.invalid"
            class="error-message"
          >
            <span *ngIf="description?.errors?.['maxLength']"
              >Description is too long</span
            >
          </div>
        </div>

        <div class="form-group">
          <label for="priority">Priority</label>

          <select class="form-select" formControlName="priority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <!-- 
          <div class="form-actions">
            <button
              type="button"
              (click)="addTask()"
              class="btn-primary"
              [disabled]="taskForm.invalid"
            >
              Create task
            </button>
            <button
              type="button"
              (click)="showForm = false"
              class="btn-secondary"
            >
              Cancel
            </button>
          </div> -->
      </form>
      <!-- </div> -->
    </div>

    <!-- Modal Footer -->
    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="onCancel()">Cancel</button>
      <button
        class="btn btn-primary"
        (click)="onSubmit()"
        [disabled]="taskForm.invalid"
      >
        {{ mode === "create" ? "Create Task" : "Update Task" }}
      </button>
    </div>
  </div>
</div>
